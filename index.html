<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anopiano · play a MIDI file as light</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <!-- Use the compiled browser-ready bundle -->
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.min.js"></script>
</head>
<body>
  <video id="webcam-bg" autoplay playsinline muted></video>
  <video id="theme-bg" autoplay playsinline muted loop></video>
  <div id="ui-container">
    <h1>Anopiano</h1>
    <p>Plays a MIDI file on a ring of 88 keys.</p>
    <div class="load-row">
      <label class="custom-file-upload">
        <input type="file" id="midi-upload" name="midi" accept=".mid,.midi">
        Choose MIDI file
      </label>
      <button id="demo-btn" type="button">Play the demo</button>
    </div>
    <div id="status" role="status">No file loaded. The demo is Bach's Prelude in C.</div>
    <div id="controls" style="display:none;">
      <button id="play-btn" type="button">Play</button>
      <button id="pause-btn" type="button">Pause</button>
      <button id="stop-btn" type="button">Stop</button>
    </div>
    <div id="secondary-controls">
      <button id="test-audio-btn" type="button">Test audio</button>
    </div>
  </div>
  <canvas id="visualizer"></canvas>

  <div id="top-controls">
    <label id="video-upload-btn">
      <input type="file" id="bg-video-upload" name="background" accept="video/*">
      <span>Background video</span>
    </label>
    <button id="camera-btn" type="button">Camera</button>
    <button id="club-btn" type="button">Club mode</button>
    <select id="effect-select" aria-label="Visual effect">
      <option value="none">No effect</option>
      <option value="carnival">Carnival</option>
      <option value="trippy">Trippy</option>
      <option value="matrix">Matrix</option>
    </select>
  </div>

  <footer id="footer">
    <span>&copy; 2026 <a href="https://bxzex.com" target="_blank" rel="noopener noreferrer">bxzex</a></span>
    <a href="https://github.com/bxzex/2050piano" target="_blank" rel="noopener noreferrer">Source</a>
    <a href="https://buy.stripe.com/9B6eVfd9E6OC3sr7cEaAw03" target="_blank" rel="noopener noreferrer">Support</a>
    <a href="https://linkedin.com/in/bxzex/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    <a href="https://instagram.com/bxzex" target="_blank" rel="noopener noreferrer">Instagram</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
